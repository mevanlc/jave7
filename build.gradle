tasks.register('autoZoomUiProbe', JavaExec) {
    group = 'verification'
    description = 'Checks automatic canvas fitting and manual zoom overrides with isolated preferences.'
    dependsOn tasks.named('testClasses'), tasks.named('prepareAutoZoomUiProbe')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'de.jave.jave.AutoZoomUiProbe'
    workingDir = autoZoomProbeDir.get().asFile
    systemProperty 'jave.probeOutput', autoZoomProbeDir.get().dir('output').asFile.absolutePath
}
