tasks.register('drawingModifiersUiProbe', JavaExec) {
    group = 'verification'
    description = 'Checks shared modifiers and endpoint snapping with isolated preferences and native input.'
    dependsOn tasks.named('testClasses'), tasks.named('prepareDrawingModifiersUiProbe')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'de.jave.jave.DrawingModifiersUiProbe'
    workingDir = drawingProbeDir.get().asFile
    systemProperty 'jave.probeOutput', drawingProbeDir.get().dir('output').asFile.absolutePath
}

def autoZoomProbeDir = layout.buildDirectory.dir('auto-zoom-probe')
tasks.register('prepareAutoZoomUiProbe', Sync) {
    into autoZoomProbeDir
    appBundleResourceDirs.each { resourceDir ->
        from(resourceDir) { into resourceDir }
    }
