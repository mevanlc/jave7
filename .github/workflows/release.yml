name: Release bundles

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer to build without publishing (no v prefix)'
        required: true
        default: '7.0.0-dev'
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      build-date: ${{ steps.metadata.outputs.buildDate }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          architecture: x64
          cache: gradle
      - name: Validate release metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          build_date=$(git show -s --format=%ct HEAD | python3 -c 'import datetime,sys; print(datetime.datetime.fromtimestamp(int(sys.stdin.read()), datetime.timezone.utc).date())')
          if [[ "$EVENT_NAME" == "push" ]]; then
            ./gradlew releaseMetadata "-PreleaseVersion=${TAG#v}" "-PreleaseTag=$TAG" "-PbuildDate=$build_date" --console=plain
          else
            ./gradlew releaseMetadata "-PreleaseVersion=$INPUT_VERSION" "-PbuildDate=$build_date" --console=plain
          fi
      - name: Export metadata
        id: metadata
        run: python3 scripts/release.py outputs
      - name: Test publication safeguards
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - uses: actions/upload-artifact@v7
        with:
          name: release-metadata
          path: build/release-metadata.json
          if-no-files-found: error

  build:
    needs: validate
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2022
            architecture: x64
            extension: zip
          - target: linux-x64
            runner: ubuntu-22.04
            architecture: x64
            extension: tar.gz
          - target: macos-arm64
            runner: macos-15
            architecture: aarch64
            extension: zip
          - target: macos-x64
            runner: macos-15-intel
            architecture: x64
            extension: zip
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      BUILD_DATE: ${{ needs.validate.outputs.build-date }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          architecture: ${{ matrix.architecture }}
          cache: gradle
      - name: Test and package
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a ./gradlew check releaseMetadata releaseBundle "-PreleaseVersion=$RELEASE_VERSION" "-PbuildDate=$BUILD_DATE" --console=plain
          else
            ./gradlew check releaseMetadata releaseBundle "-PreleaseVersion=$RELEASE_VERSION" "-PbuildDate=$BUILD_DATE" --console=plain
          fi
      - name: Verify extracted bundle
        env:
          TARGET: ${{ matrix.target }}
          EXTENSION: ${{ matrix.extension }}
        shell: bash
        run: python3 scripts/release.py verify-bundle --archive "build/distributions/jave7-$RELEASE_VERSION-$TARGET.$EXTENSION" --target "$TARGET"
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.target }}
          path: build/reports/tests/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.target }}
          path: build/distributions/jave7-${{ env.RELEASE_VERSION }}-${{ matrix.target }}.${{ matrix.extension }}
          if-no-files-found: error
          compression-level: 0

  publish:
    if: github.event_name == 'push'
    needs: [validate, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          name: release-metadata
          path: build/release
      - uses: actions/download-artifact@v8
        with:
          pattern: bundle-*
          merge-multiple: true
          path: build/release/assets
      - name: Verify uploads and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py --metadata build/release/release-metadata.json publish --directory build/release/assets --tag "$RELEASE_TAG"
