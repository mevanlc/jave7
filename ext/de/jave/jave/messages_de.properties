ToolDescriptionLabel_Generic_ToolTipText=<html><b>Generische Werkzeuge:</b><p>Generische Werkzeuge basieren auf einem komplexen, algorithmischen Berechnungsalgorithmus, um ASCII Art Formen zu erzeugen.<br>Jedes Werkzeug verwendet dabei denselben Algorithmus.<br>Generische Werkzeuge sind am besten geeignet f\u00fcr Freihandformen, Ellipsen, Bezier-Kurven und Kreisb\u00f6gen geeignet.</p></html>
ToolDescriptionLabel_Algorithmic_ToolTipText=<html><b>Algorithmische Werkzeuge:</b><p>Algorithmische Werkzeuge basieren auf speziellen Algorithmen, wie sie von ASCII-K\u00fcnstlern vorgegeben sind.<br>Jedes Werkzeug hat einen oder mehrere eigene Algorithmen.<br>Algorithmische Werkzeuge sind am besten geeignet f\u00fcr Linien und Rechtecke.</p></html>

